[package]
name = "replicated-rocksdb"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Single-master, async log-shipping replication for RocksDB"
license = "Apache-2.0"
repository = "https://github.com/wushilin/replicated-rocksdb"

[dependencies]
rocksdb = { version = "0.25.0", default-features = false, features = ["lz4", "zstd", "bindgen-runtime", "multi-threaded-cf"] }
prost = "0.14.4"
bytes = "1.12"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
uuid = { version = "1.27", features = ["v4"] }
blake3 = "1.8"
crc32c = "0.6.8"
thiserror = "2.0"
tracing = "0.1.44"
tonic = { version = "0.14.6", features = ["tls-ring"] }
tonic-prost = "0.14.6"
tonic-types = "0.14.6"
tokio-stream = { version = "0.1.19", features = ["net", "sync"] }
subtle = "2.6.1"
async-trait = "0.1.92"
fail = { version = "0.5.1", optional = true }

[features]
failpoints = ["dep:fail", "fail/failpoints"]
# Test-only: lets this crate's own test suite override defaults through environment variables
# (`RRDB_TEST_MAX_GROUP_ENTRIES`). Never enable it in a build that serves data.
test-hooks = []

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
tempfile = "3.27"
rcgen = "0.14.10"
axum = { version = "0.8.4", features = ["ws"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.53", features = ["signal", "rt-multi-thread", "macros"] }

[[test]]
name = "failpoints"
required-features = ["failpoints"]
